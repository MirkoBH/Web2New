<!doctype html>
<html lang="es-AR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' http://localhost:3000 https://*.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Ingresar: AutoPulse</title>
  <meta name="description" content="Ingresá a tu cuenta de AutoPulse para publicar autos, consultar a vendedores y comparar.">
  <meta name="theme-color" content="#0e0e0f">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="env-config.js"></script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="js/pages/login.js"></script>
</head>
<body>
  <div id="header"></div>
  <main id="content" class="page">
    <div class="wrap">
      <div class="form-narrow">
        <h1 class="h2">Ingresar</h1>
        <p class="muted mt-3 mb-5">¿No tenés cuenta? <a class="link" href="register.html">Crear cuenta</a></p>
        <div id="alerts"></div>
        <form id="form" novalidate>
          <div class="mb-4">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required maxlength="120" autocomplete="email" aria-describedby="email-error" data-error="Escribí un email con @, por ejemplo nombre@mail.com.">
            
            <p class="invalid-feedback" id="email-error"></p>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" required maxlength="72" autocomplete="current-password" aria-describedby="password-error" data-error="Escribí tu contraseña.">
            
            <p class="invalid-feedback" id="password-error"></p>
          </div>

          <button class="btn-ap btn-ap--primary w-100" type="submit">Ingresar</button>
          <p class="form-status" id="status" role="status"></p>
        </form>
      </div>
    </div>
  </main>
  <div id="footer"></div>
</body>
</html>
