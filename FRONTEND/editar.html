<!doctype html>
<html lang="es-AR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' http://localhost:3000 https://*.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Editar publicación: AutoPulse</title>
  <meta name="description" content="Editá el precio, el kilometraje, la descripción o las fotos de tu auto publicado en AutoPulse.">
  <meta name="theme-color" content="#0e0e0f">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="config-entorno.js"></script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="js/paginas/editar.js"></script>
</head>
<body>
  <div id="encabezado"></div>
  <main id="contenido" class="pagina">
    <div class="wrap">
      <div class="row">
        <div class="col-lg-8">
          <p class="label" id="editar-auto">Cargando publicación…</p>
          <h1 class="h2 mt-2">Editar publicación</h1>
          <p class="lead-text muted mt-3 mb-5 measure">Al guardar, la IA vuelve a tasar el auto con los datos nuevos.</p>
          <div id="avisos"></div>
          <form id="formulario" class="row g-4" novalidate hidden>
            <div class="col-md-6">
              <label class="form-label" for="precio">Precio (USD)</label>
              <input class="form-control" id="precio" name="precio" type="number" required min="1" max="99999999" step="1" inputmode="numeric" aria-describedby="precio-error" data-error="Escribí el precio en dólares, sin puntos.">
              
              <p class="invalid-feedback" id="precio-error"></p>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="kilometraje">Kilometraje</label>
              <input class="form-control" id="kilometraje" name="kilometraje" type="number" required min="0" max="2000000" step="1" inputmode="numeric" aria-describedby="kilometraje-error" data-error="Escribí los kilómetros, sin puntos.">
              
              <p class="invalid-feedback" id="kilometraje-error"></p>
            </div>

            <div class="col-12">
              <label class="form-label" for="descripcion">Descripción</label>
              <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required minlength="10" maxlength="3000" aria-describedby="descripcion-error" data-error="Contá cómo está el auto en al menos 10 caracteres."></textarea>
              
              <p class="invalid-feedback" id="descripcion-error"></p>
            </div>

            <div class="col-12">
              <label class="form-label" for="detallesDanios">Daños conocidos (opcional)</label>
              <textarea class="form-control" id="detallesDanios" name="detallesDanios" rows="2" maxlength="1000" aria-describedby="detallesDanios-error" data-error=""></textarea>
              
              <p class="invalid-feedback" id="detallesDanios-error"></p>
            </div>

            <div class="col-12">
              <p class="form-label">Fotos actuales</p>
              <div class="previa" id="fotos-actuales"></div>
            </div>
            <div class="col-12">
              <label class="form-label" for="imagenes">Fotos nuevas (opcional)</label>
              <input class="form-control" id="imagenes" name="imagenes" type="file" accept="image/jpeg,image/png,image/webp,image/heic" multiple aria-describedby="imagenes-error imagenes-ayuda"><div class="previa" id="previa"></div>
              <p class="form-text" id="imagenes-ayuda">Si subís fotos nuevas (de 3 a 10), reemplazan a todas las actuales.</p>
              <p class="invalid-feedback" id="imagenes-error"></p>
            </div>

            <div class="col-12">
              <div class="fila-botones">
                <button class="btn-ap btn-ap--primario" type="submit">Guardar cambios</button>
                <a class="btn-ap btn-ap--secundario" id="cancelar" href="perfil.html">Cancelar</a>
              </div>
              <p class="estado-form" id="estado" role="status"></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <div id="pie"></div>
</body>
</html>
