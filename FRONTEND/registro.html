<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoPulse | Registro</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; script-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; connect-src 'self';" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header id="app-navbar"></header>
      <main class="container py-5 d-flex justify-content-center">
        <section class="glass-panel p-4 auth-card w-100">
          <h1 class="h3 mb-3">Crear cuenta</h1>
          <div id="alert-zone"></div>
          <form id="register-form" class="d-grid gap-3" novalidate>
            <div>
              <label class="form-label" for="nombre">Nombre completo</label>
              <input class="form-control" id="nombre" required minlength="3" maxlength="80" />
            </div>
            <div>
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" type="email" required />
            </div>
            <div>
              <label class="form-label" for="telefono">Teléfono</label>
              <input class="form-control" id="telefono" required minlength="8" maxlength="30" />
            </div>
            <div>
              <label class="form-label" for="role">Rol</label>
              <select id="role" class="form-select" required>
                <option value="">Seleccionar rol</option>
                <option value="comprador">Comprador</option>
                <option value="vendedor">Vendedor</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" id="password" type="password" required minlength="8" />
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="email-verificado" required />
              <label class="form-check-label" for="email-verificado">Confirmo que el email es válido</label>
            </div>
            <button class="btn btn-danger" type="submit">Registrarme</button>
          </form>
        </section>
      </main>
      <footer id="app-footer"></footer>
    </div>

    <div id="compare-drawer-mount"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="runtime-config.js"></script>
    <script type="module" src="js/pages/registro.js"></script>
  </body>
</html>
