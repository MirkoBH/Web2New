<!doctype html>
<html lang="es-AR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' http://localhost:3000 https://*.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Autos usados en venta: AutoPulse</title>
  <meta name="description" content="Buscá autos usados en Argentina por marca, modelo, precio, año, kilometraje y provincia, con la tasación por IA de cada uno.">
  <meta name="theme-color" content="#0e0e0f">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="config-entorno.js"></script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="js/paginas/listado.js"></script>
</head>
<body>
  <div id="encabezado"></div>
  <main id="contenido" class="pagina">
    <div class="wrap">
      <div class="pagina__cabecera">
        <div>
          <h1 class="h2">Autos usados en venta</h1>
          <p class="muted" id="resumen-resultados" aria-live="polite">Buscando autos…</p>
        </div>
        <div>
          <label class="form-label" for="orden">Ordenar por</label>
          <select class="form-select" id="orden" name="orden" form="filtros">
            <option value="reciente">Más recientes</option>
            <option value="precio_asc">Menor precio</option>
            <option value="precio_desc">Mayor precio</option>
            <option value="km_asc">Menor kilometraje</option>
          </select>
        </div>
      </div>

      <div class="row g-5">
        <aside class="col-lg-3" aria-labelledby="filtros-titulo">
          <form class="filtros" id="filtros" role="search" novalidate>
            <div class="filtros__titulo">
              <h2 class="h3" id="filtros-titulo">Filtros</h2>
              <button type="button" class="btn-ap btn-ap--secundario btn-ap--chico boton-filtros" id="mostrar-filtros"
                aria-expanded="false" aria-controls="filtros-cuerpo">Mostrar filtros</button>
            </div>
            <div class="filtros__cuerpo" id="filtros-cuerpo">

            <div class="filtros__grupo">
              <label class="form-label" for="f-texto">Marca o modelo</label>
              <input class="form-control" id="f-texto" name="texto" type="search" maxlength="80" placeholder="Ej.: Toyota Corolla">
            </div>

            <div class="filtros__grupo">
              <label class="form-label" for="f-marca">Marca</label>
              <input class="form-control" id="f-marca" name="marca" type="text" maxlength="60">
              <label class="form-label mt-3" for="f-modelo">Modelo</label>
              <input class="form-control" id="f-modelo" name="modelo" type="text" maxlength="80">
            </div>

            <div class="filtros__grupo">
              <span class="form-label d-block" id="precio-etiqueta">Precio (USD)</span>
              <div class="deslizador__valores"><span id="precio-min-texto">USD 0</span><span id="precio-max-texto">Sin límite</span></div>
              <label class="visually-hidden" for="f-precio-min">Precio mínimo</label>
              <input class="deslizador" id="f-precio-min" name="precioMin" type="range" min="0" max="100000" step="1000" value="0" aria-describedby="precio-etiqueta">
              <label class="visually-hidden" for="f-precio-max">Precio máximo</label>
              <input class="deslizador" id="f-precio-max" name="precioMax" type="range" min="0" max="100000" step="1000" value="100000" aria-describedby="precio-etiqueta">
            </div>

            <div class="filtros__grupo">
              <span class="form-label d-block">Año</span>
              <div class="rango-campos">
                <div><label class="visually-hidden" for="f-anio-min">Año desde</label><input class="form-control" id="f-anio-min" name="anioMin" type="number" min="1950" max="2100" inputmode="numeric" placeholder="Desde"></div>
                <div><label class="visually-hidden" for="f-anio-max">Año hasta</label><input class="form-control" id="f-anio-max" name="anioMax" type="number" min="1950" max="2100" inputmode="numeric" placeholder="Hasta"></div>
              </div>
            </div>

            <div class="filtros__grupo">
              <span class="form-label d-block">Kilometraje</span>
              <div class="rango-campos">
                <div><label class="visually-hidden" for="f-km-min">Kilometraje desde</label><input class="form-control" id="f-km-min" name="kmMin" type="number" min="0" step="1000" inputmode="numeric" placeholder="Desde"></div>
                <div><label class="visually-hidden" for="f-km-max">Kilometraje hasta</label><input class="form-control" id="f-km-max" name="kmMax" type="number" min="0" step="1000" inputmode="numeric" placeholder="Hasta"></div>
              </div>
            </div>

            <div class="filtros__grupo">
              <label class="form-label" for="f-ubicacion">Provincia</label>
              <select class="form-select" id="f-ubicacion" name="ubicacion"><option value="">Todas</option></select>
            </div>

            <div class="filtros__grupo">
              <label class="form-label" for="f-combustible">Combustible</label>
              <select class="form-select" id="f-combustible" name="combustible">
                <option value="">Todos</option><option value="Nafta">Nafta</option><option value="Diesel">Diésel</option><option value="Hibrido">Híbrido</option><option value="Electrico">Eléctrico</option>
              </select>
            </div>

            <fieldset class="filtros__grupo">
              <legend class="form-label">Transmisión</legend>
              <div class="segmentado">
                <input type="radio" name="transmision" id="t-todas" value="" checked><label for="t-todas">Todas</label>
                <input type="radio" name="transmision" id="t-manual" value="Manual"><label for="t-manual">Manual</label>
                <input type="radio" name="transmision" id="t-auto" value="Automatico"><label for="t-auto">Automático</label>
              </div>
            </fieldset>

            <p class="invalid-feedback d-block" id="filtros-error" role="alert"></p>
            <button class="btn-ap btn-ap--primario w-100 mt-3" type="submit">Buscar autos</button>
            <button type="reset" class="btn-ap btn-ap--secundario w-100 mt-2">Limpiar filtros</button>
            </div>
          </form>
        </aside>

        <section class="col-lg-9" aria-label="Resultados">
          <div id="avisos"></div>
          <div class="row g-4" id="resultados"></div>
          <nav class="paginacion" id="paginacion" aria-label="Páginas de resultados" hidden>
            <button type="button" class="btn-ap btn-ap--secundario" data-pagina="anterior">Anterior</button>
            <span class="muted" id="pagina-actual"></span>
            <button type="button" class="btn-ap btn-ap--secundario" data-pagina="siguiente">Siguiente</button>
          </nav>
        </section>
      </div>
    </div>
  </main>
  <div id="pie"></div>
</body>
</html>
