<!doctype html>
<html lang="es-AR" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' http://localhost:3000 https://*.onrender.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Crear cuenta: AutoPulse</title>
  <meta name="description" content="Creá tu cuenta en AutoPulse para comprar o vender autos usados con tasación por IA.">
  <meta name="theme-color" content="#0e0e0f">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=Instrument+Sans:wght@400..600&display=swap">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="env-config.js"></script>
  <script src="vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="js/pages/register.js"></script>
</head>
<body>
  <div id="header"></div>
  <main id="content" class="page">
    <div class="wrap">
      <div class="form-narrow">
        <h1 class="h2">Crear cuenta</h1>
        <p class="muted mt-3 mb-5">Con una cuenta publicás autos, consultás a vendedores, guardás favoritos y comparás. ¿Ya tenés una? <a class="link" href="login.html">Ingresar</a></p>
        <div id="alerts"></div>
        <form id="form" novalidate>
          <div class="mb-4">
            <label class="form-label" for="name">Nombre y apellido</label>
            <input class="form-control" id="name" name="name" type="text" required minlength="3" maxlength="80" autocomplete="name" aria-describedby="name-error" data-error="Escribí tu nombre (al menos 3 letras).">
            
            <p class="invalid-feedback" id="name-error"></p>
          </div>

          <div class="mb-4">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required maxlength="120" autocomplete="email" aria-describedby="email-error" data-error="Escribí un email con @, por ejemplo nombre@mail.com.">
            
            <p class="invalid-feedback" id="email-error"></p>
          </div>

          <div class="mb-4">
            <label class="form-label" for="phone">Teléfono (opcional)</label>
            <input class="form-control" id="phone" name="phone" type="tel" maxlength="30" pattern="[+0-9 \(\)\-]{8,30}" autocomplete="tel" aria-describedby="phone-error phone-help" data-error="Usá solo números, espacios y + ( ) -, mínimo 8.">
            <p class="form-text" id="phone-help">No se muestra en tus publicaciones.</p>
            <p class="invalid-feedback" id="phone-error"></p>
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" required minlength="8" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,72}" autocomplete="new-password" aria-describedby="password-error password-help" data-error="La contraseña necesita 8 caracteres o más, con letras, números y un símbolo.">
            <p class="form-text" id="password-help">Mínimo 8 caracteres, con letras, números y un símbolo.</p>
            <p class="invalid-feedback" id="password-error"></p>
          </div>

          <div class="mb-4">
            <label class="form-label" for="confirm">Repetí la contraseña</label>
            <input class="form-control" id="confirm" name="confirm" type="password" required maxlength="72" autocomplete="new-password" aria-describedby="confirm-error" data-error="Las contraseñas no coinciden.">
            
            <p class="invalid-feedback" id="confirm-error"></p>
          </div>

          <button class="btn-ap btn-ap--primary w-100" type="submit">Crear cuenta</button>
          <p class="form-status" id="status" role="status"></p>
        </form>
      </div>
    </div>
  </main>
  <div id="footer"></div>
</body>
</html>
